<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexShield SaaS - Global Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-6">

    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl">
        
        <div class="text-center mb-6">
            <span class="bg-blue-500/10 text-blue-400 text-xs font-bold px-3 py-1 rounded-full border border-blue-500/30 uppercase tracking-wider">
                NexShield SaaS
            </span>
            <h1 class="text-2xl font-black mt-3">Global USD Checkout</h1>
            <p class="text-slate-400 text-xs mt-1">Next-Gen Security & Anti-Bot Protection</p>
        </div>

        <div class="bg-slate-950 border border-slate-800 rounded-2xl p-4 mb-6 flex justify-between items-center">
            <div>
                <span class="text-xs text-slate-400 block">Selected Plan</span>
                <span class="font-bold text-sm">Premium SaaS Model</span>
            </div>
            <div class="text-right">
                <span class="text-xs text-slate-400 block">Total</span>
                <span class="text-xl font-black text-blue-400">$169.00</span>
            </div>
        </div>

        <form action="#" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Full Name</label>
                <input type="text" required placeholder="John Doe" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Email Address</label>
                <input type="email" required placeholder="john@example.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Passport / Phone (Verification)</label>
                <input type="text" required placeholder="Enter ID or Phone" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500">
            </div>

            <div class="flex items-start space-x-2 pt-1">
                <input type="checkbox" required class="mt-1 rounded bg-slate-950 border-slate-800 text-blue-600">
                <label class="text-[11px] text-slate-400 leading-relaxed">
                    I agree to terms and automated bot security checks (Rate Limiting Enabled).
                </label>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl text-sm transition shadow-lg shadow-blue-600/30">
                Pay $169.00 Securely
            </button>
        </form>

        <div class="mt-6 text-center text-[11px] text-slate-500">
            🔒 256-Bit SSL Encrypted • Global USD Payouts
        </div>

    </div>

</body>
</html>
