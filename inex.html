<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexShield SaaS - Global Checkout</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-6">

    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
        
        <div class="text-center mb-6">
            <span class="bg-blue-500/10 text-blue-400 text-xs font-bold px-3 py-1 rounded-full border border-blue-500/20">
                NexShield SaaS
            </span>
            <h1 class="text-2xl font-black mt-3">Global USD Checkout</h1>
            <p class="text-slate-400 text-xs mt-1">Next-Gen Security & Anti-Bot Protection</p>
        </div>

        <form action="#" method="POST" class="space-y-4">
            
            <!-- सब कुछ बॉक्स के अंदर ($20 बेसिक प्लान के साथ) -->
            <div class="bg-slate-950 border border-slate-800 rounded-2xl p-4 space-y-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">1. Select Subscription Plan</label>
                    <select id="planSelect" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white font-bold focus:outline-none focus:border-blue-500" onchange="updateTotal()">
                        <option value="20">Basic Plan - $20.00</option>
                        <option value="80">Standard Plan - $80.00</option>
                        <option value="90">Pro Plan - $90.00</option>
                        <option value="125">Advanced Plan - $125.00</option>
                        <option value="169" selected>Premium SaaS Model - $169.00</option>
                    </select>
                </div>

                <div class="flex justify-between items-center pt-2 border-t border-slate-800">
                    <span class="text-xs text-slate-400">Total Final Amount</span>
                    <span id="totalDisplay" class="text-xl font-black text-blue-400">$169.00</span>
                </div>
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">2. Full Name</label>
                <input type="text" required placeholder="John Doe" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-blue-500">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">3. Email Address</label>
                <input type="email" required placeholder="john@example.com" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-blue-500">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">4. Passport / Phone (Anti-Fraud ID)</label>
                <input type="text" required placeholder="Enter ID or Phone Number" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-blue-500">
            </div>

            <div class="flex items-start space-x-2 pt-1">
                <input type="checkbox" required class="mt-1 rounded bg-slate-950 border-slate-800 text-blue-600 focus:ring-0">
                <label class="text-[11px] text-slate-400 leading-relaxed">
                    5. I agree to terms, rate-limiting rules, and automated 100% secure bot protection checks.
                </label>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-lg transition text-sm shadow-lg shadow-blue-600/30">
                Pay Securely Now
            </button>
        </form>

        <div class="mt-6 text-center text-[11px] text-slate-500">
            🔒 256-Bit SSL Encrypted • 100% Secure Global USD Payouts
        </div>

    </div>

    <script>
        function updateTotal() {
            var select = document.getElementById('planSelect');
            var val = select.value;
            document.getElementById('totalDisplay').innerText = '$' + val + '.00';
        }
    </script>
</body>
</html>
